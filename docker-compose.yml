services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: football-talent-hotspots-app:latest
    env_file: .env
    volumes:
      - .:/workspaces/football-talent-hotspots
    working_dir: /workspaces/football-talent-hotspots
    ports:
      - "3838:3838"   # Shiny
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity

  db:
    image: postgis/postgis:16-3.5
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
